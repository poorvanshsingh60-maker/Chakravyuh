name: Backend CI

on:
  push:
    branches: [ main, aditya_front, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Lint, Type Check & Pytest (CP-SAT Solver)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install ruff mypy pytest pytest-asyncio ortools pymongo pydantic

      - name: Lint with Ruff
        run: |
          ruff check backend/ || echo "Ruff check completed with notes"

      - name: Type check with Mypy
        run: |
          mypy backend/ --ignore-missing-imports || echo "Mypy check completed"

      - name: Run Pytest
        env:
          MONGODB_URI: mongodb://localhost:27017/chakravyuh_test
          JWT_SECRET: ci_test_secret_key_12345
        run: |
          if [ -d backend/tests ]; then pytest backend/tests/ -v; else echo "No backend test directory yet"; fi
